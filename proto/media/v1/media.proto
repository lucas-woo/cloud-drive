syntax="proto3";

option go_package = "github.com/lucas-woo/cloud-drive/api/media/v1/mediav1";

package media.v1;


message CreateNewProjectRequest {
  string user_id = 1;
  string project_name = 2;
  string description = 3;
}

message CreateNewProjectResponse {
  string project_name = 1;
  string project_id = 2;
}

message UploadObjectRequest {
  string user_id = 1;
  string project_id = 2;
  string object_name = 3;
  string folder = 4;
}

message UploadObjectResponse {
  string signed_url = 1;
  string object_id = 2;
}


message ImageUploadInfo {
  string project_id = 1;
  string object_name = 2;
  string folder = 3;

  //params
  uint32 width = 4;
  uint32 height = 5;
  string crop = 6;
}

message UploadImageApiRequest {
  oneof payload {
    ImageUploadInfo upload_info = 1;
    bytes image_chunk = 2;
  }
}

message UploadImageApiResponse {
  string object_id = 1;
}



message LambdaS3UploadConfirmationRequest {
  string object_id = 1;
  uint64 file_size = 2;
  string format = 3;
}

message LambdaS3UploadConfirmationResponse {}
